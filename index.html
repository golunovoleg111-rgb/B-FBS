<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-FBS</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{min-height:100vh;display:flex}.side{width:280px;background:#111827;color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;padding:0 10px 30px}.mark{width:40px;height:40px;border:1px solid #4b5563;border-radius:10px;display:grid;place-items:center;font-weight:800}.name{font-weight:800}.sub{font-size:11px;color:#9ca3af;margin-top:3px}.nav{display:grid;gap:5px}.nav button{min-height:48px;border:0;border-radius:9px;background:transparent;color:#aeb6c4;text-align:left;padding:0 12px;display:flex;gap:12px;align-items:center;cursor:pointer;font-size:13px}.nav button:hover{background:#1b2434;color:#fff}.nav button.active{background:#fff;color:#111827;font-weight:650}.num{width:22px;font-size:10px;opacity:.55}.foot{margin-top:auto;border-top:1px solid #273244;padding:16px 10px 0;color:#8f99aa;font-size:11px}.main{flex:1}.top{min-height:104px;background:#fff;border-bottom:1px solid #e4e7eb;padding:25px 38px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;font-weight:750;letter-spacing:.12em;color:#8992a1}.title{margin:5px 0 0;font-size:25px}.user{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:650}.avatar{width:34px;height:34px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;font-size:12px}.btn{height:34px;border:0;border-radius:7px;background:#111827;color:#fff;padding:0 12px;font-weight:650;cursor:pointer}.content{padding:32px 38px}.dashboard{display:grid;gap:24px}.welcome{display:flex;justify-content:space-between;align-items:end}.welcome h2{margin:0;font-size:21px}.welcome p{margin:6px 0 0;color:#737d8c;font-size:13px}.date{font-size:12px;color:#8992a1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:#fff;border:1px solid #e2e6eb;border-radius:12px;padding:20px}.metric-label{font-size:11px;color:#737d8c}.metric-value{margin-top:11px;font-size:28px;font-weight:750}.metric-note{margin-top:8px;font-size:11px;color:#8992a1}.panels{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.panel-head{display:flex;justify-content:space-between;margin-bottom:20px}.panel-title{font-size:14px;font-weight:700}.panel-link{font-size:11px;color:#737d8c}.status-list{display:grid;gap:13px}.status-row{display:grid;grid-template-columns:1fr auto;gap:12px}.status-name{font-size:12px}.status-bar{height:6px;background:#edf0f3;border-radius:10px;overflow:hidden;margin-top:7px}.status-fill{height:100%;background:#8b95a3}.status-count{font-size:12px;font-weight:700}.empty-panel{min-height:130px;display:grid;place-items:center;text-align:center;color:#8992a1;font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);padding:36px;background:#fff;border:1px solid #e2e6eb;border-radius:16px;box-shadow:0 12px 40px #11182712}.login-mark{width:48px;height:48px;border:1px solid #d1d6dd;border-radius:12px;display:grid;place-items:center;font-weight:800;margin-bottom:22px}.card h1{margin:0 0 7px;font-size:25px}.desc{margin:0 0 26px;color:#737d8c;font-size:13px}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-size:12px;font-weight:650}.form input{height:44px;border:1px solid #d7dce3;border-radius:8px;padding:0 12px;font:inherit}.form .btn{height:44px}.error{padding:10px 12px;border-radius:8px;background:#f1f2f4;color:#4b5563;font-size:12px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.side{width:100%;padding:16px}.brand{padding-bottom:16px}.nav{grid-template-columns:repeat(2,1fr)}.foot{display:none}.top{padding:18px}.content{padding:18px}.welcome{display:block}.date{margin-top:10px}.metrics{grid-template-columns:1fr 1fr}.user .btn{display:none}}</style></head><body><div id="root"></div><script>(function(){var key='b-fbs-auth',tabs=['Главный экран','Рабочее пространство','Учет склада','Заявка на перемещение','Ревизия','Личный кабинет','Сборочное задание'];function login(){root.innerHTML='<main class="login"><section class="card"><div class="login-mark">B</div><div class="eyebrow">B-FBS</div><h1>Вход в систему</h1><p class="desc">Складская рабочая система</p><form class="form" id="form"><label>Логин<input id="login"></label><label>Пароль<input id="password" type="password"></label><div id="error"></div><button class="btn">Войти</button></form></section></main>';form.onsubmit=function(e){e.preventDefault();if(login.value==='Admin1'&&password.value==='Admin123'){sessionStorage.setItem(key,'admin');render()}else error.innerHTML='<div class="error">Неверный логин или пароль</div>'}}function dashboard(){return '<div class="dashboard"><div class="welcome"><div><h2>Оперативная сводка</h2><p>Ключевые показатели склада за текущий момент.</p></div><div class="date">WB API: не подключен</div></div><div class="metrics"><div class="metric"><div class="metric-label">Заказы</div><div class="metric-value">0</div><div class="metric-note">Актуальные заказы на WB</div></div><div class="metric"><div class="metric-label">Готовые задания</div><div class="metric-value">0</div><div class="metric-note">Ожидают сборки</div></div><div class="metric"><div class="metric-label">Завершенные</div><div class="metric-value">0</div><div class="metric-note">Отгружены и закрыты</div></div><div class="metric"><div class="metric-label">Остатки</div><div class="metric-value">0</div><div class="metric-note">Единиц товара на складе</div></div></div><div class="panels"><div class="panel"><div class="panel-head"><div class="panel-title">Состояние сборки</div><div class="panel-link">Сегодня</div></div><div class="status-list"><div class="status-row"><div><div class="status-name">В очереди</div><div class="status-bar"><div class="status-fill" style="width:0%"></div></div></div><div class="status-count">0</div></div><div class="status-row"><div><div class="status-name">В работе</div><div class="status-bar"><div class="status-fill" style="width:0%"></div></div></div><div class="status-count">0</div></div><div class="status-row"><div><div class="status-name">Готово к отгрузке</div><div class="status-bar"><div class="status-fill" style="width:0%"></div></div></div><div class="status-count">0</div></div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Последние события</div></div><div class="empty-panel">Событий пока нет</div></div></div></div>'}function render(){if(sessionStorage.getItem(key)!=='admin')return login();root.innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="mark">B</div><div><div class="name">B-FBS</div><div class="sub">Складская система</div></div></div><nav class="nav" id="nav"></nav><div class="foot">● Система готова</div></aside><main class="main"><header class="top"><div><div class="eyebrow">B-FBS / РАБОЧАЯ СРЕДА</div><div class="title" id="title">Главный экран</div></div><div class="user"><span class="avatar">A</span>Admin1 <button id="api" class="btn">API Интеграция</button><button id="logout" class="btn">Выйти</button></div></header><section class="content" id="content">'+dashboard()+'</section></main></div>';tabs.forEach(function(tab,i){var b=document.createElement('button');b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+tab+'</span>';if(i===0)b.className='active';b.onclick=function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');title.textContent=tab;content.innerHTML=i===0?dashboard():'<div class="empty-panel panel" style="min-height:500px">Раздел подготовлен. Функциональность будет добавляться поэтапно.</div>'};nav.appendChild(b)});logout.onclick=function(){sessionStorage.removeItem(key);login()};api.onclick=function(){alert('API Интеграция будет реализована отдельным этапом: подключение ключа WB и синхронизация данных.')}}render()})();</script></body></html>
