<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="B-FBS — складская система">
  <title>B-FBS</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;min-width:320px}.app{min-height:100vh;display:flex}.side{width:280px;background:#111827;color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.mark{width:40px;height:40px;border:1px solid #4b5563;border-radius:10px;display:grid;place-items:center;font-weight:800}.name{font-weight:800;letter-spacing:.05em}.sub{font-size:11px;color:#9ca3af;margin-top:3px}.nav{display:grid;gap:5px}.nav button{min-height:48px;border:0;border-radius:9px;background:transparent;color:#aeb6c4;text-align:left;padding:0 12px;display:flex;gap:12px;align-items:center;cursor:pointer;font-size:13px}.nav button:hover{background:#1b2434;color:white}.nav button.active{background:#fff;color:#111827;font-weight:650}.num{width:22px;font-size:10px;opacity:.55}.foot{margin-top:auto;border-top:1px solid #273244;padding:16px 10px 0;color:#8f99aa;font-size:11px}.main{flex:1;min-width:0}.top{height:104px;background:#fff;border-bottom:1px solid #e4e7eb;padding:25px 38px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;font-weight:750;letter-spacing:.12em;color:#8992a1}.title{margin:5px 0 0;font-size:25px;letter-spacing:-.02em}.user{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:650}.avatar{width:34px;height:34px;border-radius:50%;background:#eef0f3;display:grid;place-items:center;font-size:12px}.content{padding:38px}.empty{min-height:calc(100vh - 180px);border:1px dashed #cdd3db;border-radius:14px;background:#fff8;display:grid;place-content:center;justify-items:center;text-align:center;padding:40px}.icon{width:52px;height:52px;border:1px solid #d8dde4;border-radius:12px;display:grid;place-items:center;color:#697386;font-size:12px;font-weight:750}.empty h2{margin:18px 0 7px;font-size:20px}.empty p{margin:0;color:#737d8c;font-size:13px;line-height:1.6}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f8}.card{width:min(420px,100%);padding:36px;background:#fff;border:1px solid #e2e6eb;border-radius:16px;box-shadow:0 12px 40px #11182712}.login-mark{width:48px;height:48px;border:1px solid #d1d6dd;border-radius:12px;display:grid;place-items:center;font-weight:800;margin-bottom:22px}.card h1{margin:0 0 7px;font-size:25px}.desc{margin:0 0 26px;color:#737d8c;font-size:13px}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-size:12px;font-weight:650}.form input{width:100%;height:44px;border:1px solid #d7dce3;border-radius:8px;padding:0 12px;font:inherit;outline:0}.form input:focus{border-color:#7b8492}.btn{height:44px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:650;cursor:pointer}.btn:hover{background:#202b3d}.error{padding:10px 12px;border-radius:8px;background:#f1f2f4;color:#4b5563;font-size:12px}@media(max-width:700px){.app{display:block}.side{width:100%;padding:16px}.brand{padding-bottom:16px}.nav{grid-template-columns:repeat(2,1fr)}.foot{display:none}.top{height:auto;padding:18px}.content{padding:18px}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var key='b-fbs-auth';
  var tabs=['Главный экран','Рабочее пространство','Учет склада','Заявка на перемещение','Ревизия','Личный кабинет','Сборочное задание'];
  function login(){document.getElementById('root').innerHTML='<main class="login"><section class="card"><div class="login-mark">B</div><div class="eyebrow">B-FBS</div><h1>Вход в систему</h1><p class="desc">Складская рабочая система</p><form class="form" id="form"><label>Логин<input id="login" autocomplete="username"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><div id="error"></div><button class="btn" type="submit">Войти</button></form></section></main>';document.getElementById('form').onsubmit=function(e){e.preventDefault();if(document.getElementById('login').value==='Admin1'&&document.getElementById('password').value==='Admin123'){sessionStorage.setItem(key,'admin');render()}else document.getElementById('error').innerHTML='<div class="error">Неверный логин или пароль</div>'}}
  function render(){if(sessionStorage.getItem(key)!=='admin')return login();document.getElementById('root').innerHTML='<div class="app"><aside class="side"><div class="brand"><div class="mark">B</div><div><div class="name">B-FBS</div><div class="sub">Складская система</div></div></div><nav class="nav" id="nav"></nav><div class="foot">● Система готова</div></aside><main class="main"><header class="top"><div><div class="eyebrow">B-FBS / РАБОЧАЯ СРЕДА</div><div class="title" id="title">Главный экран</div></div><div class="user"><span class="avatar">A</span>Admin1 <button id="logout" class="btn" style="height:34px;padding:0 12px;margin-left:8px">Выйти</button></div></header><section class="content"><div class="empty"><div class="icon" id="icon">01</div><h2 id="heading">Главный экран</h2><p>Раздел подготовлен. Функциональность будет добавляться поэтапно.</p></div></section></main></div>';var nav=document.getElementById('nav');tabs.forEach(function(tab,i){var b=document.createElement('button');b.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span>'+tab+'</span>';if(i===0)b.className='active';b.onclick=function(){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById('title').textContent=tab;document.getElementById('heading').textContent=tab;document.getElementById('icon').textContent=String(i+1).padStart(2,'0')};nav.appendChild(b)});document.getElementById('logout').onclick=function(){sessionStorage.removeItem(key);login()}}
  render();
})();
</script>
</body>
</html>
